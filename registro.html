<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Lombana Therapy</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="header">
  <a href="index.html" class="logo">
    <h1>Lombana Therapy</h1>
  </a>

    <nav class="nav">
      <a href="index.html">Inicio</a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <main>
    <section class="form-section">
      <form class="form-card" onsubmit="registrarUsuario(event)">
        <h2>Crear cuenta</h2>

        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" required>

        <label for="telefono">Teléfono</label>
        <input type="text" id="telefono">
        <label for="genero">Género</label>
        <select id="genero" required>
          <option value="">Selecciona una opción</option>
          <option value="femenino">Femenino</option>
          <option value="masculino">Masculino</option>
          <option value="otro">Otro</option>
        </select>
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" required>

        <label for="password">Contraseña</label>
        <input type="password" id="password" required>

        <button type="submit" class="btn-primary">Registrarme</button>

        <p class="form-link">
          ¿Ya tienes cuenta?
          <a href="login.html">Inicia sesión aquí</a>
        </p>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
