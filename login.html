<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Lombana Therapy</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

 <!-- ENCABEZADO UNIFICADO PARA TODOS LOS MÓDULOS -->
  <header class="header">
    <a href="index.html" class="logo">
      <h1>Lombana Therapy</h1>
    </a>

    <!-- BOTÓN HAMBURGUESA -->
    <button
      type="button"
      class="hamburger-btn"
      id="hamburger-btn"
      aria-label="Abrir menú"
      aria-expanded="false"
    >
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>

    <nav class="nav" id="nav-menu">
      <a href="index.html">Inicio</a>

      <a
        href="mis-citas.html"
        id="btn-mis-citas"
        class="solo-sesion oculto"
      >
        Citas
      </a>

      <div class="dropdown">
        <a href="terapias.html" class="dropdown-btn">Terapias</a>

        <div class="dropdown-content" id="menu-terapias">
          <a href="terapias.html">Cargando terapias...</a>
        </div>
      </div>

      <a href="agendar.html">Agendar terapia</a>
      <a href="index.html#contacto">Contacto</a>
      <a href="index.html#ubicacion">Ubicación</a>

      <a href="login.html" class="solo-invitado">
        Login
      </a>

      <button
        type="button"
        onclick="cerrarSesion()"
        class="btn-logout solo-sesion oculto"
        id="btn-logout"
      >
        Cerrar sesión
      </button>
    </nav>
  </header>

  <!-- FONDO OSCURO MÓVIL -->
  <div class="menu-overlay" id="menu-overlay"></div>

  <main>
    <section class="form-section">
      <form class="form-card" onsubmit="iniciarSesion(event)">
        <h2>Iniciar sesión</h2>

        <label for="email">Correo electrónico</label>
        <input type="email" id="email" required>

        <label for="password">Contraseña</label>
        <input type="password" id="password" required>

        <button type="submit" class="btn-primary">Entrar</button>

        <p class="form-link">
            ¿No tienes cuenta?
            <a id="link-registro" href="registro.html">Regístrate aquí</a>        </p>

         <p class="form-link">
            ¿Eres terapeuta?
            <a href="admin.html">Entrar al panel</a>
         </p>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const redirect = params.get('redirect');
    const linkRegistro = document.getElementById('link-registro');

    if (redirect && linkRegistro) {
      linkRegistro.href = 'registro.html?redirect=' + encodeURIComponent(redirect);
    }
  </script>
</body>
</html>
